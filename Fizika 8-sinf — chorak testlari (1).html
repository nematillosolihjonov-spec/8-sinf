html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}

.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.qs{display:grid;gap:10px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px;text-align:left}

.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:20px}
.timer.low{color:var(--bad)}
.prog{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--pri)}
.opt{display:block;width:100%;margin:8px 0}
.opt.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dots b{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);display:grid;place-items:center;font-size:13px;font-weight:600;cursor:pointer}
.dots b.done{background:var(--pri);color:var(--prit);border-color:var(--pri)}.dots b.cur{outline:2px solid var(--tx)}
.score{font-size:40px;font-weight:800;margin:4px 0}
.rev{border-top:1px solid var(--bd);padding:12px 0}
label.sw{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px}
.hide{display:none}

 $("#app").innerHTML=`<h1>Fizika 8-sinf</h1><div class="mut">Chorak kirish testlari · har birida 25 ta savol</div>
 <div class="card"><h2>Chorakni tanlang</h2><div class="qs">${TITLES.map((t,i)=>`<button class="q ${i===S.q?"sel":""}" onclick="S.q=${i};home()">${t}<small>${SUB[i]}</small></button>`).join("")}</div>
 <label class="sw">Vaqt (daqiqa): <select id="min" onchange="S.min=+this.value">${[10,15,20,25,30,40,45].map(m=>`<option ${m===S.min?"selected":""}>${m}</option>`).join("")}</select></label>
 <label class="sw"><input type="checkbox" id="sh" ${S.shuffle?"checked":""} onchange="S.shuffle=this.checked"> Savollarni aralashtirish</label></div>
 <button class="pri opt" onclick="start()">Boshlash</button>`;
}
function start(){
 let idx=DATA[S.q].map((_,i)=>i);
 if(S.shuffle)for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
 S.list=idx;S.ans=Array(idx.length).fill(-1);S.i=0;S.left=S.min*60;
 clearInterval(S.t);S.t=setInterval(()=>{S.left--;tick();if(S.left<=0)finish()},1000);
 quiz();
}
function tick(){const e=$("#tm");if(e){e.textContent=fmt(Math.max(S.left,0));e.classList.toggle("low",S.left<=60)}}
function quiz(){
 const n=S.list.length,q=DATA[S.q][S.list[S.i]];
 const done=S.ans.filter(a=>a>=0).length;
 $("#app").innerHTML=`<div class="bar"><div class="mut">Savol ${S.i+1} / ${n} · javob: ${done}</div><div class="timer" id="tm">${fmt(S.left)}</div></div>
 <div class="prog"><i style="width:${done/n*100}%"></i></div>
 <div class="card"><h2>${S.i+1}. ${esc(q.q)}</h2>${q.o.map((o,k)=>`<button class="opt ${S.ans[S.i]===k?"sel":""}" onclick="pick(${k})"><b>${L[k]})</b> ${esc(o)}</button>`).join("")}</div>
 <div class="row"><button onclick="go(-1)" ${S.i===0?"disabled":""}>← Oldingi</button>${S.i<n-1?`<button class="pri" onclick="go(1)">Keyingi →</button>`:`<button class="pri" onclick="ask()">Yakunlash</button>`}</div>
 <div class="dots">${S.list.map((_,k)=>`<b class="${S.ans[k]>=0?"done":""} ${k===S.i?"cur":""}" onclick="S.i=${k};quiz()">${k+1}</b>`).join("")}</div>
 <button class="opt" onclick="if(confirm('Testni to‘xtatib, bosh sahifaga qaytasizmi?'))home()">Bosh sahifa</button>`;
 tick();
}
function pick(k){S.ans[S.i]=k;quiz()}
function go(d){S.i+=d;quiz()}
function ask(){const un=S.ans.filter(a=>a<0).length;if(!un||confirm(un+" ta savolga javob berilmagan. Baribir yakunlaysizmi?"))finish()}
function finish(){
 clearInterval(S.t);
 const n=S.list.length;let ok=0;
 S.list.forEach((qi,k)=>{if(S.ans[k]===DATA[S.q][qi].a)ok++});
 const pct=Math.round(ok/n*100),used=S.min*60-Math.max(S.left,0);
 $("#app").innerHTML=`<h1>Natija</h1><div class="mut">${TITLES[S.q]} · sarflangan vaqt: ${fmt(used)}</div>
 <div class="card"><div class="score">${ok} / ${n}</div><div>To‘g‘ri javoblar: <b>${pct}%</b> · xato: ${S.ans.filter((a,k)=>a>=0&&a!==DATA[S.q][S.list[k]].a).length} · javobsiz: ${S.ans.filter(a=>a<0).length}</div></div>
 <div class="row"><button class="pri" onclick="start()">Qayta boshlash</button><button onclick="home()">Chorakni tanlash</button></div>
 <div class="card"><h2>Javoblarni ko‘rish</h2>${S.list.map((qi,k)=>{const q=DATA[S.q][qi],a=S.ans[k];
 return `<div class="rev"><b>${k+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<div class="opt ${j===q.a?"ok":(j===a?"bad":"")}" style="padding:8px 12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0">${L[j]}) ${esc(o)}</div>`).join("")}${a<0?'<div class="mut">Javob berilmagan</div>':""}</div>`}).join("")}</div>`;
 window.scrollTo(0,0);
}
home();
</script></body></html>
